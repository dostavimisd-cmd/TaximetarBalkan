name: iOS IPA (nepotpisan, za ličnu upotrebu)

# Pokreće se ručno iz Actions taba (Run workflow) ili pri push-u na ovaj fajl.
# Gradi na besplatnoj macOS mašini GitHub-a; rezultat je NEPOTPISAN .ipa,
# za sideload (TrollStore / Sideloadly + AppSync) na jailbreakovan uređaj.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-ipa.yml'

env:
  # Naziv .ipa fajla (iPad); prazno = verzija iz pubspec.yaml.
  NAZIV_IPA: '1.2.3'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Zavisnosti
        run: flutter pub get

      - name: Verzija iz pubspec.yaml
        run: |
          VERZIJA="${NAZIV_IPA:-$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')}"
          echo "VERZIJA=$VERZIJA" >> "$GITHUB_ENV"

      - name: Build (bez potpisivanja)
        run: flutter build ios --release --no-codesign

      - name: Spakuj u .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "TaksimetarBalkan-$VERZIJA.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TaksimetarBalkan-ipa-${{ env.VERZIJA }}
          path: build/ios/iphoneos/TaksimetarBalkan-${{ env.VERZIJA }}.ipa
          retention-days: 14
